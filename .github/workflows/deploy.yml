name: CI / Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}   # e.g. myregistry.azurecr.io
  BACKEND_IMAGE: stig-backend
  FRONTEND_IMAGE: stig-frontend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Lint & Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm run lint --workspace=backend || true

      - name: Lint frontend
        run: npm run lint --workspace=frontend || true

      - name: Run backend tests
        working-directory: backend
        env:
          MOCK_MODE: 'true'
          NODE_ENV: test
          AZURE_TENANT_ID: test-tenant
          AZURE_CLIENT_ID: test-client
        run: npx ts-jest --passWithNoTests || npm test

      # Frontend unit tests (vitest)
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run || echo "No frontend tests yet"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Build Docker images (only on push to main)
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        # Skip if ACR secrets are not set
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ secrets.AZURE_CONTAINER_REGISTRY != '' }}
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
        continue-on-error: true

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ secrets.AZURE_CONTAINER_REGISTRY != '' }}
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_AZURE_CLIENT_ID=${{ secrets.VITE_AZURE_CLIENT_ID }}
            VITE_AZURE_TENANT_ID=${{ secrets.VITE_AZURE_TENANT_ID }}
            VITE_API_SCOPE=${{ secrets.VITE_API_SCOPE }}
            VITE_MOCK_MODE=false
          cache-from: type=gha
          cache-to:   type=gha,mode=max
        continue-on-error: true

      # Build plain Node bundles as deployment packages (fallback for App Service zip deploy)
      - name: Install & build backend
        run: |
          npm install --workspace=backend
          npm run build --workspace=backend

      - name: Package backend
        run: |
          cd backend
          cp package.json dist/
          cp openapi.yaml dist/
          cd dist
          npm install --omit=dev --prefix .
          zip -r ../../backend-deploy.zip .

      - name: Build frontend
        env:
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_API_SCOPE:       ${{ secrets.VITE_API_SCOPE }}
          VITE_MOCK_MODE:       false
        run: |
          npm install --workspace=frontend
          npm run build --workspace=frontend

      - name: Package frontend
        run: |
          cd frontend/dist
          zip -r ../../frontend-deploy.zip .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy
          path: backend-deploy.zip

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy
          path: frontend-deploy.zip

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 — Deploy to Azure App Service
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-deploy

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name:  ${{ secrets.AZURE_BACKEND_APP_NAME }}
          package:   backend-deploy.zip

      - name: Deploy frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name:  ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          package:   frontend-deploy.zip

      - name: Azure Logout
        run: az logout
        if: always()
