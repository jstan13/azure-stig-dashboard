name: CI

# Continuous integration: lint + tests + container image build verification.
#
# This workflow does NOT publish anything. Distribution to end users happens
# via .github/workflows/release.yml when you push a vX.Y.Z tag (signed images
# to ghcr.io + a GitHub Release with a pinned azuredeploy.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Lint + unit tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: NPM audit (high/critical)
        run: npm audit --workspaces --omit=dev --audit-level=high

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: Run backend tests
        working-directory: backend
        env:
          MOCK_MODE: 'true'
          NODE_ENV: test
          AZURE_TENANT_ID: test-tenant
          AZURE_CLIENT_ID: test-client
        run: npm test

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

  # ────────────────────────────────────────────────────────────────────────────
  # Infrastructure — compile main.bicep and prove the checked-in ARM template
  # (shipped to end users by the Deploy-to-Azure button) is byte-for-byte what
  # main.bicep produces. Without this, security fixes made in Bicep can silently
  # fail to reach the template people actually deploy.
  # ────────────────────────────────────────────────────────────────────────────
  infra:
    name: Bicep build & ARM template drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/azuredeploy.json"

      - name: Verify infra/azuredeploy.json is in sync
        run: |
          # Ignore every _generator metadata block, which embeds the Bicep CLI
          # version and differs between local and CI toolchains. Modules compile
          # to nested templates that carry their own _generator, so this has to
          # strip recursively rather than only at the top level.
          STRIP='walk(if type == "object" and has("metadata") then .metadata |= del(._generator) else . end)'
          jq "$STRIP" "$RUNNER_TEMP/azuredeploy.json" > "$RUNNER_TEMP/expected.json"
          jq "$STRIP" infra/azuredeploy.json          > "$RUNNER_TEMP/actual.json"
          if ! diff -q "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/actual.json" >/dev/null; then
            echo "::error::infra/azuredeploy.json is out of sync with infra/main.bicep."
            echo "Regenerate it with: az bicep build --file infra/main.bicep --outfile infra/azuredeploy.json"
            diff -u "$RUNNER_TEMP/actual.json" "$RUNNER_TEMP/expected.json" | head -60
            exit 1
          fi
          echo "infra/azuredeploy.json is in sync with infra/main.bicep"

  # ────────────────────────────────────────────────────────────────────────────
  # Image build smoke test — proves the release workflow can produce images,
  # without publishing them. Runs on every push so a broken Dockerfile never
  # reaches a tagged release.
  # ────────────────────────────────────────────────────────────────────────────
  docker_smoke:
    name: Docker build smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: stig-backend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: stig-frontend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
