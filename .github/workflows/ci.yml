name: CI

# Continuous integration: lint + tests + container image build verification.
#
# This workflow does NOT publish anything. Distribution to end users happens
# via .github/workflows/release.yml when you push a vX.Y.Z tag (signed images
# to ghcr.io + a GitHub Release with a pinned azuredeploy.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Lint + unit tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: NPM audit (high/critical)
        run: npm audit --workspaces --omit=dev --audit-level=high

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: Run backend tests
        working-directory: backend
        env:
          MOCK_MODE: 'true'
          NODE_ENV: test
          AZURE_TENANT_ID: test-tenant
          AZURE_CLIENT_ID: test-client
        run: npm test

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

  # ────────────────────────────────────────────────────────────────────────────
  # Image build smoke test — proves the release workflow can produce images,
  # without publishing them. Runs on every push so a broken Dockerfile never
  # reaches a tagged release.
  # ────────────────────────────────────────────────────────────────────────────
  docker_smoke:
    name: Docker build smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: stig-backend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: stig-frontend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
