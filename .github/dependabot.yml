# Dependabot keeps dependencies patched and opens PRs for security advisories.
# Updates are grouped so a solo maintainer gets a handful of PRs, not dozens.
version: 2
updates:
  # npm workspaces (frontend, backend, functions, packages/shared) via the root manifest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      production-patches:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      e2e-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs, not tags — tags are mutable and were
  # retargeted in the 2026 trivy-action compromise. Dependabot updates the SHA
  # and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ['*']

  # Base images for the published containers. Majors are pinned out: the whole
  # stack targets Node 20 (App Service linuxFxVersion, WEBSITE_NODE_DEFAULT_VERSION,
  # CI setup-node), so a base-image major has to be a deliberate coordinated change.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
