server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────
    # The SPA loads no inline scripts (see index.html), so script-src can stay
    # strict. Fluent UI injects styles at runtime, so style-src needs
    # 'unsafe-inline'. connect-src/frame-src allow https: because the API and
    # Entra authority hosts vary per deployment (commercial vs Gov, custom API
    # URL) and are supplied at container start via runtime-config.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Proxy /api to backend
    # The backend sets its own CSP via helmet (relaxed only for Swagger UI at
    # /api/docs). Declaring add_header here cancels inheritance of the strict
    # SPA CSP above, which would otherwise intersect with it and break Swagger.
    location /api/ {
        # Rendered at container start. nginx resolves a literal proxy_pass host
        # while loading its config, so a name that only exists on the compose
        # network stops the container from starting anywhere else.
        proxy_pass ${BACKEND_ORIGIN};
        proxy_ssl_server_name on;
        # $proxy_host, not $host: App Service routes on the Host header, so
        # forwarding the frontend's hostname would miss the backend entirely.
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    # NOTE: add_header in a location block replaces inherited headers, so the
    # security headers above must be repeated here for asset responses.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
