openapi: 3.0.3
info:
  title: Azure STIG Dashboard API
  description: |
    RESTful API for the Azure STIG Dashboard.
    Provides machine inventory, compliance findings, scan management, and STIG checklist export.
  version: 1.0.0
  contact:
    name: Azure STIG Dashboard
servers:
  - url: /api
    description: API base path

security:
  - bearerAuth: []

paths:
  /scan/trigger:
    post:
      summary: Trigger a new scan
      tags: [Scan]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptionIds:    { type: array, items: { type: string } }
                resourceGroupNames: { type: array, items: { type: string } }
                resourceIds:        { type: array, items: { type: string } }
                since:              { type: string, format: date-time, description: Start of incremental window }
      responses:
        '202':
          description: Scan accepted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /scan:
    get:
      summary: List recent scans
      tags: [Scan]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK

  /machines:
    get:
      summary: List machines
      tags: [Machines]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search name / resource group }
        - { name: status, in: query, schema: { type: string } }
        - { name: subscriptionId, in: query, schema: { type: string } }
        - { name: resourceGroup, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: '#/components/schemas/Machine' } }
                  total: { type: integer }

  /machines/{id}:
    get:
      summary: Get machine details with findings
      tags: [Machines]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /groups/{id}/compliance:
    get:
      summary: Get group compliance rollup
      tags: [Groups]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Resource group name or 'all' }
      responses:
        '200': { description: OK }

  /export/checklist:
    post:
      summary: Export machine checklist
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machineId]
              properties:
                machineId: { type: string }
                format:    { type: string, enum: [ckl, json, csv], default: ckl }
      responses:
        '200':
          description: Checklist file
          content:
            application/xml:
              schema: { type: string }
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
        '400': { description: Validation error }
        '404': { description: Machine not found }

  /controls:
    get:
      summary: List STIG controls
      tags: [Controls]
      parameters:
        - { name: severity, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: OK }

  /controls/{id}:
    get:
      summary: Get control details
      tags: [Controls]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /audit:
    get:
      summary: Get audit log
      tags: [Audit]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }

  /emass/config:
    get:
      summary: Get eMASS configuration status without secret values
      tags: [eMASS]
      responses:
        '200': { description: Configuration status }
        '403': { description: Administrator permission required }
    put:
      summary: Save encrypted eMASS connection configuration
      tags: [eMASS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl, userUid]
              properties:
                baseUrl: { type: string, format: uri }
                userUid: { type: string }
                apiKey: { type: string, format: password, description: Blank or omitted retains the stored value }
                certPem: { type: string, format: password, description: Blank or omitted retains the stored value }
                keyPem: { type: string, format: password, description: Blank or omitted retains the stored value }
                caPem: { type: string, format: password, nullable: true }
      responses:
        '200': { description: Configuration saved; secret presence flags only }
        '400': { description: Validation error }
        '403': { description: Administrator permission required }
    delete:
      summary: Clear database-saved eMASS configuration
      tags: [eMASS]
      responses:
        '200': { description: Saved configuration cleared; deployment environment fallback may remain active }
        '403': { description: Administrator permission required }

  /emass/status:
    get:
      summary: Test eMASS configuration and API connectivity
      tags: [eMASS]
      responses:
        '200': { description: Configuration and connection status }

  # ─── STIG Library ────────────────────────────────────────────────────────────
  /stigs:
    get:
      summary: List all STIG benchmarks
      tags: [STIGs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StigBenchmark'
                  total: { type: integer }

  /stigs/import:
    post:
      summary: Trigger STIG content import from DISA
      tags: [STIGs]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                benchmarkTitles:
                  type: array
                  items: { type: string }
                  description: Specific benchmark titles to import (omit for all defaults)
                force:
                  type: boolean
                  default: false
                  description: Re-import even if version is already active
                dryRun:
                  type: boolean
                  default: false
      responses:
        '202': { description: Import started }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }

  /stigs/update-check:
    post:
      summary: Check DISA catalog for newer STIG versions
      tags: [STIGs]
      security:
        - bearerAuth: []
      responses:
        '202': { description: Check started }
        '409': { description: Check already in progress }

  /stigs/update-check/status:
    get:
      summary: Get status of most recent update check
      tags: [STIGs]
      responses:
        '200': { description: OK }

  /stigs/{benchmarkId}:
    get:
      summary: Get benchmark details and version history
      tags: [STIGs]
      parameters:
        - { name: benchmarkId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /stigs/{benchmarkId}/controls:
    get:
      summary: List controls for a STIG benchmark
      tags: [STIGs]
      parameters:
        - { name: benchmarkId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: string }, description: 'e.g. V2R8 (defaults to active)' }
        - { name: severity, in: query, schema: { type: string, enum: [high, medium, low] } }
        - { name: checkType, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 100 } }
      responses:
        '200': { description: OK }
        '404': { description: Benchmark or version not found }

  /stigs/{benchmarkId}/scan:
    post:
      summary: Trigger PowerSTIG audit scan for this STIG on all machines
      tags: [STIGs]
      security:
        - bearerAuth: []
      parameters:
        - { name: benchmarkId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                machineIds:
                  type: array
                  items: { type: string }
                  description: Specific machine IDs to scan (omit for all Windows machines)
                version:
                  type: string
                  description: 'STIG version to use e.g. V2R8 (defaults to active)'
      responses:
        '202': { description: Scan triggered }
        '404': { description: Benchmark not found }

  /updates:
    get:
      summary: Current version, the release on offer, and the auto-update policy
      tags: [Updates]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
        '403': { description: Missing dashboard:read }

  /updates/policy:
    put:
      summary: Change the auto-update policy
      description: >-
        `mode: auto` with `requireApproval: true` means an administrator signs
        off on each release; with `requireApproval: false` releases install
        unattended during the maintenance window.
      tags: [Updates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePolicy' }
      responses:
        '200': { description: Saved }
        '400': { description: Invalid policy (including an unknown IANA time zone) }
        '403': { description: Missing updates:manage }

  /updates/approve:
    post:
      summary: Clear a specific release for installation
      tags: [Updates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 'v0.3.5' }
      responses:
        '200': { description: Approved }
        '409': { description: That version is not the release currently on offer }
        '403': { description: Missing updates:manage }

  /updates/apply:
    post:
      summary: Install the available release now, ignoring the window and approval gate
      description: >-
        Queues the work for the scheduler Function; the backend cannot replace
        its own container image without killing the request.
      tags: [Updates]
      security:
        - bearerAuth: []
      responses:
        '202': { description: Update queued }
        '409': { description: Nothing to install }
        '403': { description: Missing updates:manage }

  /updates/available:
    post:
      summary: Scheduler reports the newest upstream release
      tags: [Updates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 'v0.3.5' }
                notes:   { type: string }
      responses:
        '200': { description: Recorded, with the action the scheduler should take next }
        '403': { description: Missing updates:report }

  /updates/result:
    post:
      summary: Scheduler reports how an install went
      tags: [Updates]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, result]
              properties:
                version:         { type: string }
                previousVersion: { type: string, nullable: true }
                result:          { type: string, enum: [succeeded, rolled_back, failed] }
                detail:          { type: string }
      responses:
        '200': { description: Recorded }
        '403': { description: Missing updates:report }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Azure AD JWT token obtained via MSAL

  schemas:
    Machine:
      type: object
      properties:
        id:            { type: string }
        name:          { type: string }
        resourceId:    { type: string }
        subscriptionId: { type: string }
        resourceGroupName: { type: string }
        location:      { type: string }
        osType:        { type: string }
        osVersion:     { type: string }
        complianceScore: { type: number }
        lastScanDate:  { type: string, format: date-time }
        status:        { type: string, enum: [online, offline, unknown] }

    Finding:
      type: object
      properties:
        id:             { type: string }
        machineId:      { type: string }
        controlId:      { type: string }
        status:         { type: string, enum: [open, not_a_finding, not_applicable, not_reviewed] }
        severity:       { type: string, enum: [high, medium, low, informational] }
        comments:       { type: string }
        findingDetails: { type: string }
        sourceType:     { type: string }

    Control:
      type: object
      properties:
        id:           { type: string, example: V-220700 }
        stigId:       { type: string, example: WN10-AU-000005 }
        title:        { type: string }
        severity:     { type: string, enum: [high, medium, low, informational] }
        description:  { type: string }
        checkContent: { type: string }
        fixText:      { type: string }

    Scan:
      type: object
      properties:
        id:              { type: string }
        machineId:       { type: string }
        status:          { type: string, enum: [pending, running, completed, failed] }
        scanType:        { type: string, enum: [full, incremental, on-demand] }
        openFindings:    { type: number }
        compliantControls: { type: number }
        startedAt:       { type: string, format: date-time }
        completedAt:     { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }

    UpdatePolicy:
      type: object
      properties:
        mode:            { type: string, enum: [off, notify, auto] }
        requireApproval: { type: boolean }
        securityOnly:    { type: boolean }
        dayOfWeek:       { type: integer, minimum: 0, maximum: 6, nullable: true, description: '0 = Sunday; null = any day' }
        hour:            { type: integer, minimum: 0, maximum: 23 }
        timeZone:        { type: string, example: 'America/New_York' }
    UpdateHistoryEntry:
      type: object
      properties:
        version:         { type: string }
        previousVersion: { type: string, nullable: true }
        startedAt:       { type: string, format: date-time }
        finishedAt:      { type: string, format: date-time }
        result:          { type: string, enum: [succeeded, rolled_back, failed] }
        detail:          { type: string }
        actor:           { type: string }
    UpdateStatus:
      type: object
      properties:
        currentVersion:   { type: string, nullable: true }
        availableVersion: { type: string, nullable: true }
        availableNotes:   { type: string, nullable: true }
        updateAvailable:  { type: boolean }
        approvedVersion:  { type: string, nullable: true }
        approvedBy:       { type: string, nullable: true }
        lastCheckedAt:    { type: string, format: date-time, nullable: true }
        inWindowNow:      { type: boolean }
        nextAction:
          type: object
          properties:
            action:  { type: string, enum: [none, notify, install] }
            version: { type: string }
            reason:  { type: string }
        policy:  { $ref: '#/components/schemas/UpdatePolicy' }
        history:
          type: array
          items: { $ref: '#/components/schemas/UpdateHistoryEntry' }
    StigBenchmark:
      type: object
      properties:
        benchmarkId:            { type: string, example: 'Windows_10_STIG' }
        title:                  { type: string }
        category:               { type: string, example: 'Operating System' }
        platform:               { type: string, example: 'Windows' }
        latestInstalledVersion: { type: string, nullable: true, example: 'V2R8' }
        latestAvailableVersion: { type: string, nullable: true, example: 'V2R9' }
        updateAvailable:        { type: boolean }
        lastContentUpdate:      { type: string, format: date-time, nullable: true }
        active:                 { type: boolean }

